name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate module compilation
        run: |
          python -m py_compile src/ingestion/ingest.py src/transformations/clean_flights.py src/validation/validate_flights.py src/analytics/build_gold.py src/reporting/visualize.py airflow/dags/flight_delay_pipeline.py run_pipeline.py

      - name: Run tests (fast/default)
        env:
          PYTHONPATH: ${{ github.workspace }}
          USE_FIXTURES: '1'
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      # Optional: full data-dependent tests require raw/silver/gold artifacts and are expensive.
      # Enable by setting repository variable RUN_DATA_TESTS=1 and providing fixtures/artifacts.
      - name: Run data-dependent tests (optional)
        if: ${{ vars.RUN_DATA_TESTS == '1' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          RUN_SLOW_E2E: ${{ vars.RUN_SLOW_E2E }}
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
